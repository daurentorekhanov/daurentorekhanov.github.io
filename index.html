<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,interactive-widget=resizes-content"/>
<title>Dauren Torekhanov • Interactive CV</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--surf:#111827;--surf2:#1a2232;
  --border:rgba(59,130,246,0.15);
  --ac:#3b82f6;--ac2:#8b5cf6;--ac3:#06b6d4;
  --text:#94a3b8;--bright:#e2e8f0;--dim:#64748b;
  --green:#22c55e;
  --grad:linear-gradient(135deg,#3b82f6,#8b5cf6);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
#pc,#cc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#pc{z-index:0}
#cc{z-index:9999}

/* LAYOUT */
.wrap{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;z-index:1;display:flex;justify-content:center}
.panel{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* HEADER */
.head{display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(10,14,26,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff;flex-shrink:0;box-shadow:0 0 18px rgba(59,130,246,.35)}
.head-info{flex:1;min-width:0}
.head-name{font-weight:700;font-size:1rem;color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-sub{font-size:.78rem;color:var(--dim);display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0}
.status{color:var(--green);font-weight:500}
.head-acts{display:flex;gap:8px;flex-shrink:0}
.head-btn{padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:600;text-decoration:none;border:1px solid var(--border);color:var(--text);transition:all .2s;white-space:nowrap}
.head-btn:hover{border-color:var(--ac);color:var(--bright);background:rgba(59,130,246,.1)}
.lang-switch{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;flex-shrink:0}
.lang-btn{padding:6px 10px;border:0;background:transparent;color:var(--text);font-family:'Inter',sans-serif;font-size:.74rem;font-weight:700;cursor:pointer;transition:all .2s}
.lang-btn.active{background:var(--grad);color:#fff}

/* MESSAGES */
.messages{flex:1;overflow-y:auto;padding:20px 20px 28px;display:flex;flex-direction:column;gap:16px}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

/* MESSAGE GROUPS */
.msg-group{display:flex;gap:10px;animation:msgIn .25s ease forwards}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-group.user{flex-direction:row-reverse}
.msg-av{width:32px;height:32px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;color:#fff;flex-shrink:0;align-self:flex-end}
.msg-body{display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 48px)}
.msg-group.user .msg-body{align-items:flex-end}
.msg-bubble{background:var(--surf2);border-radius:18px 18px 18px 4px;padding:12px 16px;color:var(--bright);font-size:.92rem;word-break:break-word}
.msg-group.user .msg-bubble{background:var(--grad);border-radius:18px 18px 4px 18px;color:#fff}
.msg-time{font-size:.68rem;color:var(--dim);padding:0 4px}

/* CONTENT BLOCKS */
.msg-p{margin:0}
.msg-p+.msg-p,.msg-p.stacked{margin-top:8px}

.msg-list{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:4px}
.msg-list li{display:flex;gap:8px;font-size:.88rem;color:var(--bright);padding:2px 0}
.msg-list li::before{content:'▸';color:var(--ac);flex-shrink:0}

.msg-card{background:rgba(59,130,246,.05);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-top:8px;position:relative;overflow:hidden}
.msg-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.mcard-role{font-weight:700;color:var(--bright);font-size:.9rem}
.mcard-co{color:var(--ac);font-size:.82rem;margin-top:2px;font-weight:500}
.mcard-period{color:var(--dim);font-size:.76rem;margin-top:1px}
.mcard-detail{color:var(--text);font-size:.83rem;margin-top:6px;line-height:1.5}

.msg-skill-sec{margin-top:8px}
.msg-skill-label{font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);font-weight:600;margin-bottom:5px}
.msg-tags{display:flex;flex-wrap:wrap;gap:5px}
.msg-tag{padding:3px 11px;border-radius:20px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);color:var(--ac);font-size:.8rem;font-weight:500}

.msg-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.msg-stat{background:rgba(59,130,246,.07);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
.mstat-num{font-size:1.35rem;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.mstat-label{font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

.msg-link-btn{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:7px 16px;border-radius:20px;background:var(--grad);color:#fff;font-size:.83rem;font-weight:600;text-decoration:none;transition:transform .2s,box-shadow .2s}
.msg-link-btn:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(59,130,246,.35)}

.msg-dl-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.msg-dl-btn{padding:7px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--border);color:var(--bright);font-size:.82rem;font-weight:600;text-decoration:none;transition:all .2s}
.msg-dl-btn:hover{border-color:var(--ac);background:rgba(59,130,246,.1)}

.msg-fun-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.msg-fun-btn{padding:7px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--border);color:var(--bright);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s}
.msg-fun-btn:hover{border-color:var(--ac);background:rgba(59,130,246,.1);transform:translateY(-2px)}

/* TYPING CURSOR */
.tcursor{display:inline-block;width:2px;height:1em;background:var(--ac);margin-left:1px;vertical-align:text-bottom;animation:cblink .8s step-end infinite}
@keyframes cblink{50%{opacity:0}}

/* TYPING INDICATOR */
.typing-ind{display:flex;gap:4px;align-items:center;padding:4px 2px}
.td{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:tbounce 1.2s ease infinite}
.td:nth-child(2){animation-delay:.2s}
.td:nth-child(3){animation-delay:.4s}
@keyframes tbounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* SUGGESTION CHIPS */
.ichips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;padding-left:42px}
.ichip{padding:6px 14px;border-radius:20px;background:var(--surf);border:1px solid var(--border);color:var(--ac);font-size:.82rem;font-weight:600;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:all .2s;opacity:0;animation:chipIn .3s cubic-bezier(.16,1,.3,1) forwards}
.ichip:hover{border-color:var(--ac);background:rgba(59,130,246,.1);transform:translateY(-2px)}
@keyframes chipIn{from{opacity:0;transform:scale(.85) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* BLOCK ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.fade-up{opacity:0;animation:fadeUp .35s cubic-bezier(.16,1,.3,1) forwards}
.fade-in{opacity:0;animation:fadeIn .3s ease forwards}

/* FOOTER */
.foot{flex-shrink:0;border-top:1px solid var(--border);background:rgba(10,14,26,.95);backdrop-filter:blur(20px);padding:14px 20px 22px}
.input-row{display:flex;gap:10px;align-items:center}
#inp{flex:1;background:var(--surf);border:1px solid var(--border);border-radius:24px;padding:11px 20px;color:var(--bright);font-family:'Inter',sans-serif;font-size:.92rem;outline:none;transition:border-color .2s}
#inp:focus{border-color:var(--ac)}
#inp::placeholder{color:var(--dim)}
#inp:disabled{opacity:.6;cursor:not-allowed}
#snd{padding:11px 22px;border-radius:24px;background:var(--grad);border:none;color:#fff;font-family:'Inter',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;flex-shrink:0}
#snd:hover{transform:scale(1.05);box-shadow:0 4px 18px rgba(59,130,246,.4)}
#snd:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--surf);border:1px solid var(--ac);color:var(--bright);padding:9px 20px;border-radius:24px;font-size:.84rem;font-weight:600;z-index:10001;opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* RIPPLE */
.ripple{position:fixed;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.2) 0%,transparent 70%);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);animation:rippleA .6s ease-out forwards}
@keyframes rippleA{from{width:0;height:0;opacity:1}to{width:180px;height:180px;opacity:0}}

/* MOBILE */
@media(max-width:600px){
  .panel{border:none}
  .head{padding:12px 14px;flex-wrap:wrap;gap:10px}
  .av{width:36px;height:36px;font-size:.78rem}
  .head-name{font-size:.9rem}
  .head-info{flex:1 1 calc(100% - 50px)}
  .head-sub{font-size:.72rem}
  .head-acts{width:100%;justify-content:flex-end;gap:6px}
  .head-btn{padding:6px 10px;font-size:.72rem}
  .lang-btn{padding:6px 8px}
  .messages{padding:14px;gap:12px}
  .msg-bubble{font-size:.88rem;padding:10px 14px}
  .ichips{padding-left:0}
  .foot{padding:10px 12px 14px}
  #inp{padding:10px 16px;font-size:.88rem}
  #snd{padding:10px 16px;font-size:.84rem}
  .msg-stats{gap:6px}
  .mstat-num{font-size:1.15rem}
}
@supports(padding:env(safe-area-inset-bottom)){
  .foot{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
}
@media(max-width:600px){
  @supports(padding:env(safe-area-inset-bottom)){
    .foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  }
}
</style>
</head>
<body>
<canvas id="pc"></canvas>
<canvas id="cc"></canvas>

<div class="wrap">
  <div class="panel">
    <header class="head">
      <div class="av">DT</div>
      <div class="head-info">
        <div class="head-name" id="headName">Dauren Torekhanov</div>
        <div class="head-sub" id="headSub">Technical Lead / Senior Backend Engineer &nbsp;<span class="dot"></span>&nbsp;<span class="status">available</span></div>
      </div>
      <div class="head-acts">
        <div class="lang-switch" aria-label="Language">
          <button class="lang-btn active" type="button" data-lang="en">EN</button>
          <button class="lang-btn" type="button" data-lang="ru">RU</button>
        </div>
        <a href="classic.html" class="head-btn hide-sm" id="classicLink">Classic CV</a>
        <a href="files/Dauren%20Torekhanov%20EN.pdf" download class="head-btn" id="headCvBtn">&#8595; CV</a>
      </div>
    </header>
    <div class="messages" id="msgs"></div>
    <footer class="foot">
      <div class="input-row">
        <input type="text" id="inp" placeholder="Type /help or a command…" autocomplete="off" spellcheck="false"/>
        <button id="snd" type="button">Send</button>
      </div>
    </footer>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ── UTILS ──────────────────────────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ts(){ return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}); }
const CV = {
  en:{pdf:'files/Dauren%20Torekhanov%20EN.pdf', docx:'files/Dauren%20Torekhanov%20EN.docx'},
  ru:{pdf:'files/Dauren%20Torekhanov%20RU.pdf', docx:'files/Dauren%20Torekhanov%20RU.docx'},
};
let lang = new URLSearchParams(location.search).get('lang') === 'ru' ? 'ru' : 'en';
function cvFile(type='pdf'){ return CV[lang][type]; }
function setLang(next, rerender=true){
  lang = next === 'ru' ? 'ru' : 'en';
  document.documentElement.lang = lang;
  document.title = lang === 'ru' ? 'Даурен Тореханов • Интерактивное CV' : 'Dauren Torekhanov • Interactive CV';
  document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.toggle('active', btn.dataset.lang === lang));
  document.getElementById('headName').textContent = lang === 'ru' ? 'Даурен Тореханов' : 'Dauren Torekhanov';
  document.getElementById('headSub').innerHTML = lang === 'ru'
    ? 'Technical Lead / Senior Backend Engineer &nbsp;<span class="dot"></span>&nbsp;<span class="status">доступен</span>'
    : 'Technical Lead / Senior Backend Engineer &nbsp;<span class="dot"></span>&nbsp;<span class="status">available</span>';
  document.getElementById('classicLink').textContent = lang === 'ru' ? 'Классическое CV' : 'Classic CV';
  document.getElementById('classicLink').href = lang === 'ru' ? 'classic.html?lang=ru' : 'classic.html';
  document.getElementById('headCvBtn').href = cvFile('pdf');
  document.getElementById('inp').placeholder = lang === 'ru' ? 'Введите /help или команду…' : 'Type /help or a command…';
  document.getElementById('snd').textContent = lang === 'ru' ? 'Отправить' : 'Send';
  if(rerender) restartIntro();
}

// ── SCROLL ─────────────────────────────────────────────────────────────
const msgsEl = document.getElementById('msgs');
function smartScroll(){
  const near = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 100;
  if(near) msgsEl.scrollTop = msgsEl.scrollHeight;
}

// ── TOAST ──────────────────────────────────────────────────────────────
const toastEl = document.getElementById('toast');
let toastT;
function showToast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

// ── TYPEWRITER ─────────────────────────────────────────────────────────
async function typeInto(el, text){
  const tn = document.createTextNode('');
  const cur = document.createElement('span');
  cur.className = 'tcursor';
  el.appendChild(tn); el.appendChild(cur);
  for(const ch of text){
    tn.textContent += ch;
    smartScroll();
    await sleep(18);
  }
  cur.remove();
}

// ── RENDER BLOCK ───────────────────────────────────────────────────────
function renderBlock(container, block, si){
  const d = si * 75;
  switch(block.type){
    case 'text': {
      const p = document.createElement('p');
      p.className = 'msg-p stacked fade-up';
      p.style.animationDelay = d + 'ms';
      p.textContent = block.text;
      container.appendChild(p);
      break;
    }
    case 'list': {
      const ul = document.createElement('ul');
      ul.className = 'msg-list';
      block.items.forEach((item,i)=>{
        const li = document.createElement('li');
        li.className = 'fade-up';
        li.style.animationDelay = (d + i*55) + 'ms';
        li.textContent = item;
        ul.appendChild(li);
      });
      container.appendChild(ul);
      break;
    }
    case 'card': {
      const c = document.createElement('div');
      c.className = 'msg-card fade-up';
      c.style.animationDelay = d + 'ms';
      c.innerHTML = `<div class="mcard-role">${esc(block.role)}</div>` +
        `<div class="mcard-co">${esc(block.company)}</div>` +
        `<div class="mcard-period">${esc(block.period)}</div>` +
        (block.detail ? `<div class="mcard-detail">${esc(block.detail)}</div>` : '');
      container.appendChild(c);
      break;
    }
    case 'skill-section': {
      const sec = document.createElement('div');
      sec.className = 'msg-skill-sec fade-up';
      sec.style.animationDelay = d + 'ms';
      const lbl = document.createElement('div');
      lbl.className = 'msg-skill-label';
      lbl.textContent = block.label;
      const tags = document.createElement('div');
      tags.className = 'msg-tags';
      block.tags.forEach(t=>{
        const span = document.createElement('span');
        span.className = 'msg-tag';
        span.textContent = t;
        tags.appendChild(span);
      });
      sec.appendChild(lbl); sec.appendChild(tags);
      container.appendChild(sec);
      break;
    }
    case 'stats': {
      const grid = document.createElement('div');
      grid.className = 'msg-stats';
      block.items.forEach((st,i)=>{
        const s = document.createElement('div');
        s.className = 'msg-stat fade-in';
        s.style.animationDelay = (d + i*80) + 'ms';
        s.innerHTML = `<div class="mstat-num">${esc(st.num)}</div><div class="mstat-label">${esc(st.label)}</div>`;
        grid.appendChild(s);
      });
      container.appendChild(grid);
      break;
    }
    case 'link': {
      const a = document.createElement('a');
      a.className = 'msg-link-btn fade-up';
      a.style.animationDelay = d + 'ms';
      a.textContent = block.text;
      a.href = block.href;
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      container.appendChild(a);
      break;
    }
    case 'downloads': {
      const wrap = document.createElement('div');
      wrap.className = 'msg-dl-wrap';
      block.items.forEach((item,i)=>{
        const a = document.createElement('a');
        a.className = 'msg-dl-btn fade-up';
        a.style.animationDelay = (d + i*65) + 'ms';
        a.textContent = item.label;
        a.href = item.href;
        a.download = '';
        wrap.appendChild(a);
      });
      container.appendChild(wrap);
      break;
    }
    case 'fun-buttons': {
      const wrap = document.createElement('div');
      wrap.className = 'msg-fun-wrap';
      [
        ['🎊 Confetti', ()=>launchConfetti({clientX:innerWidth/2,clientY:innerHeight/2})],
        ['🖥️ Matrix',   matrixRain],
        ['🎆 Fireworks', spawnFireworks],
        ['🌊 Earthquake', shakeIt],
        ['🙃 Invert',   invertColors],
      ].forEach(([label,fn],i)=>{
        const btn = document.createElement('button');
        btn.className = 'msg-fun-btn fade-up';
        btn.type = 'button';
        btn.style.animationDelay = (d + i*65) + 'ms';
        btn.textContent = label;
        btn.onclick = fn;
        wrap.appendChild(btn);
      });
      container.appendChild(wrap);
      break;
    }
  }
}

// ── BOT MESSAGE ────────────────────────────────────────────────────────
function addTypingGroup(){
  const g = document.createElement('div');
  g.className = 'msg-group bot';
  g.innerHTML = `<div class="msg-av">DT</div><div class="msg-body"><div class="msg-bubble"><div class="typing-ind"><div class="td"></div><div class="td"></div><div class="td"></div></div></div></div>`;
  msgsEl.appendChild(g); smartScroll();
  return g;
}

async function addBotMsg(blocks, suggestions=[]){
  const g = document.createElement('div');
  g.className = 'msg-group bot';
  const body = document.createElement('div');
  body.className = 'msg-body';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = ts();
  body.appendChild(bubble); body.appendChild(time);
  g.appendChild(document.createElement('div')).className = 'msg-av';
  g.firstChild.textContent = 'DT';
  g.appendChild(body);
  msgsEl.appendChild(g); smartScroll();

  let typed = false, si = 0;
  for(const block of blocks){
    if(!typed && block.type === 'text'){
      const p = document.createElement('p');
      p.className = 'msg-p';
      bubble.appendChild(p);
      await typeInto(p, block.text);
      typed = true;
    } else {
      renderBlock(bubble, block, si++);
    }
    smartScroll();
  }

  await sleep(100);
  if(suggestions.length){
    const chips = document.createElement('div');
    chips.className = 'ichips';
    suggestions.forEach((s,i)=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ichip';
      btn.textContent = s;
      btn.style.animationDelay = (i*60+80)+'ms';
      btn.onclick = ()=>{ if(!busy) dispatch(s); };
      chips.appendChild(btn);
    });
    body.appendChild(chips);
    smartScroll();
  }
}

function addUserMsg(text){
  const g = document.createElement('div');
  g.className = 'msg-group user';
  const body = document.createElement('div');
  body.className = 'msg-body';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = ts();
  body.appendChild(bubble); body.appendChild(time);
  g.appendChild(body);
  msgsEl.appendChild(g); smartScroll();
}

// ── COMMANDS ───────────────────────────────────────────────────────────
const CMDS = {};

CMDS['/help'] = ()=>({
  blocks: lang === 'ru' ? [

// ── DISPATCH ───────────────────────────────────────────────────────────
let busy = false;

async function dispatch(rawText){
  if(busy) return;
  busy = true;

  const inp = document.getElementById('inp');
  const snd = document.getElementById('snd');
  inp.value = ''; inp.disabled = true; snd.disabled = true;

  const text = rawText.trim();
  const key  = text.toLowerCase();

  addUserMsg(text);

  if(key === '/clear'){
    await sleep(200);
    msgsEl.innerHTML = '';
    busy = false; inp.disabled = false; snd.disabled = false; inp.focus();
    return;
  }

  const typing = addTypingGroup();
  await sleep(360 + Math.random()*160);
  typing.remove();

  const fn = CMDS[key];
  if(fn){
    const {blocks, suggestions} = fn();
    await addBotMsg(blocks, suggestions);
  } else if(key.startsWith('/')){
    await addBotMsg(
      [{type:'text', text: lang === 'ru' ? `Неизвестная команда "${key}". Введите /help.` : `Unknown command "${key}". Type /help to see what's available.`}],
      ['/help']
    );
  } else {
    await addBotMsg(
      [{type:'text', text: lang === 'ru' ? "Используйте /команды, чтобы посмотреть мой профиль. Введите /help для списка команд." : "Try using a /command to explore my background. Type /help to see all options."}],
      ['/help','/about']
    );
  }

  busy = false; inp.disabled = false; snd.disabled = false; inp.focus();
}

// ── PARTICLES ──────────────────────────────────────────────────────────
const pc = document.getElementById('pc');
const pCtx = pc.getContext('2d');
let particles=[], mx=0, my=0;
function resizeP(){ pc.width=innerWidth; pc.height=innerHeight; }
resizeP(); addEventListener('resize', resizeP);
document.addEventListener('mousemove', e=>{ mx=e.clientX; my=e.clientY; });
class Particle{
  constructor(){ this.reset(); }
  reset(){
    this.x=Math.random()*pc.width; this.y=Math.random()*pc.height;
    this.vx=(Math.random()-.5)*.4; this.vy=(Math.random()-.5)*.4;
    this.r=Math.random()*1.5+.5; this.o=Math.random()*.25+.05;
  }
  update(){
    this.x+=this.vx; this.y+=this.vy;
    if(this.x<0||this.x>pc.width) this.vx*=-1;
    if(this.y<0||this.y>pc.height) this.vy*=-1;
    const dx=mx-this.x, dy=my-this.y, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<120){ this.x+=dx*.003; this.y+=dy*.003; }
  }
  draw(){
    pCtx.beginPath(); pCtx.arc(this.x,this.y,this.r,0,Math.PI*2);
    pCtx.fillStyle=`rgba(59,130,246,${this.o})`; pCtx.fill();
  }
}
const isMobile = innerWidth<=768;
for(let i=0;i<(isMobile?20:50);i++) particles.push(new Particle());
(function animP(){
  pCtx.clearRect(0,0,pc.width,pc.height);
  particles.forEach(p=>{ p.update(); p.draw(); });
  for(let i=0;i<particles.length-1;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<100){
        pCtx.beginPath(); pCtx.moveTo(particles[i].x,particles[i].y); pCtx.lineTo(particles[j].x,particles[j].y);
        pCtx.strokeStyle=`rgba(59,130,246,${.07*(1-d/100)})`; pCtx.lineWidth=.5; pCtx.stroke();
      }
    }
  }
  requestAnimationFrame(animP);
})();

// ── CONFETTI ───────────────────────────────────────────────────────────
const cc = document.getElementById('cc');
const cCtx = cc.getContext('2d');
let confettis=[], cfOn=false;
function resizeC(){ cc.width=innerWidth; cc.height=innerHeight; }
resizeC(); addEventListener('resize', resizeC);
class Confetti{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=(Math.random()-.5)*14; this.vy=Math.random()*-16-4;
    this.g=.35; this.rot=Math.random()*360; this.rs=(Math.random()-.5)*8;
    this.w=Math.random()*10+5; this.h=Math.random()*5+3;
    this.color=`hsl(${Math.random()*360},80%,60%)`; this.life=1;
  }
  update(){ this.vy+=this.g; this.x+=this.vx; this.y+=this.vy; this.rot+=this.rs; this.life-=.009; }
  draw(){
    cCtx.save(); cCtx.translate(this.x,this.y); cCtx.rotate(this.rot*Math.PI/180);
    cCtx.fillStyle=this.color; cCtx.globalAlpha=this.life;
    cCtx.fillRect(-this.w/2,-this.h/2,this.w,this.h); cCtx.restore();
  }
}
function animConf(){
  cCtx.clearRect(0,0,cc.width,cc.height);
  confettis.forEach(c=>{ c.update(); c.draw(); });
  confettis=confettis.filter(c=>c.life>0);
  if(confettis.length>0) requestAnimationFrame(animConf); else cfOn=false;
}
function launchConfetti(e){
  for(let i=0;i<(isMobile?40:90);i++) confettis.push(new Confetti(e.clientX,e.clientY));
  if(!cfOn){ cfOn=true; animConf(); }
  showToast('🎊 Party time!');
}

// ── MATRIX ─────────────────────────────────────────────────────────────
let matrixOn=false, matrixId;
function matrixRain(){
  if(matrixOn){
    matrixOn=false; cancelAnimationFrame(matrixId);
    cCtx.clearRect(0,0,cc.width,cc.height); showToast('Matrix off'); return;
  }
  matrixOn=true; showToast('🔴 Welcome to the Matrix');
  const cols=Math.floor(cc.width/16), drops=Array(cols).fill(0);
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()';
  (function draw(){
    if(!matrixOn) return;
    cCtx.fillStyle='rgba(0,0,0,0.05)'; cCtx.fillRect(0,0,cc.width,cc.height);
    cCtx.fillStyle='#0f0'; cCtx.font='14px JetBrains Mono,monospace';
    for(let i=0;i<drops.length;i++){
      cCtx.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,drops[i]*16);
      if(drops[i]*16>cc.height&&Math.random()>.975) drops[i]=0;
      drops[i]++;
    }
    matrixId=requestAnimationFrame(draw);
  })();
  setTimeout(()=>{ if(matrixOn){ matrixOn=false; cancelAnimationFrame(matrixId); cCtx.clearRect(0,0,cc.width,cc.height); } },8000);
}

function spawnFireworks(){
  showToast('🎆 Fireworks!'); let n=0;
  const iv=setInterval(()=>{
    const x=Math.random()*innerWidth, y=Math.random()*innerHeight*.6;
    for(let i=0;i<(isMobile?15:28);i++){
      const p=document.createElement('div'), hue=Math.random()*360, sz=3+Math.random()*4;
      p.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:hsl(${hue},90%,60%);border-radius:50%;pointer-events:none;z-index:9999;box-shadow:0 0 6px hsl(${hue},90%,60%)`;
      document.body.appendChild(p);
      const a=(Math.PI*2/28)*i+Math.random()*.3, v=60+Math.random()*110;
      p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+40}px) scale(0)`,opacity:0}],
        {duration:700+Math.random()*400,easing:'cubic-bezier(0,0.9,0.3,1)'}).onfinish=()=>p.remove();
    }
    if(++n>=5) clearInterval(iv);
  },400);
}

function shakeIt(){

  const iv=setInterval(()=>{
    document.body.style.transform=`translate(${(Math.random()-.5)*18}px,${(Math.random()-.5)*18}px)`;
    if(++n>28){ clearInterval(iv); document.body.style.transform=''; document.body.style.transition=''; }
  },30);
  showToast('🌊 Earthquake!');
}

// ── INVERT ─────────────────────────────────────────────────────────────
let inverted=false;
function invertColors(){
  inverted=!inverted;
  document.body.style.filter=inverted?'invert(1) hue-rotate(180deg)':'';
  showToast(inverted?'🙃 Upside down!':'Back to normal');
  if(inverted) setTimeout(()=>{ inverted=false; document.body.style.filter=''; },4000);
}

// ── MOBILE KEYBOARD FIX ────────────────────────────────────────────────
// dvh handles modern browsers; visualViewport listener covers older iOS
if(window.visualViewport){
  const wrap = document.querySelector('.wrap');
  const update = ()=>{ wrap.style.height = window.visualViewport.height+'px'; };
  window.visualViewport.addEventListener('resize', update);
}

// ── KONAMI ─────────────────────────────────────────────────────────────
const konami=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let kIdx=0;
document.addEventListener('keydown',e=>{
  kIdx = e.key===konami[kIdx] ? kIdx+1 : 0;
  if(kIdx===konami.length){
    kIdx=0;
    showToast('🕹️ KONAMI CODE!');
    for(let j=0;j<4;j++) setTimeout(()=>{
      for(let i=0;i<80;i++) confettis.push(new Confetti(Math.random()*innerWidth,Math.random()*innerHeight*.3));
      if(!cfOn){ cfOn=true; animConf(); }
    },j*200);
  }
});
</script>
